name: OpenCode Security Review
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/opencode-security-review.yml'
      - '.opencode/**'
      - 'bootstrap/**'
      - 'governance/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'server/**'
      - 'src/**'
      - 'test/**'
      - 'package*.json'
      - 'docker-compose*.yml'
      - 'Dockerfile'

jobs:
  security-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit and security tests
        run: node scripts/run-tests.mjs --group unit --reporter spec
      - name: Capability and workflow contracts
        run: node scripts/run-tests.mjs --group contract --reporter dot
      - name: Security integration tests
        run: node scripts/run-tests.mjs --group integration --reporter dot
      - name: Ecosystem validation
        run: node scripts/validate-ecosystem.mjs
      - name: Governance drift
        run: node scripts/check-governance-drift.mjs
