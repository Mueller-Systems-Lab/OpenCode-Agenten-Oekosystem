name: OpenCode Visual QA
on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/opencode-visual-qa.yml'
      - 'client/src/**'
      - 'src/**/*.css'
      - 'src/**/*.scss'
      - 'src/**/*.sass'
      - 'src/**/*.less'
      - '**/*.tsx'
      - '**/*.jsx'
      - '**/*.vue'
      - '**/*.svelte'
      - '**/*.astro'
      - '**/playwright.config.*'
      - '**/.storybook/**'
      - 'package*.json'

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Classify pull request diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Emits CHECK_RESULT, REASON, EVALUATED_PATHS, and VISUAL_PATHS.
        # Applicable changes fail closed until repository-owned visual QA exists.
        run: node scripts/classify-visual-qa-diff.mjs --base "$BASE_SHA" --head "$HEAD_SHA" --fail-on-applicable
