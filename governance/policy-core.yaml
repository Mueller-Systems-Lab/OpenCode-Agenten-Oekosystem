{
  "schema_version": "governance-v2.policy-core.1",
  "version": "2.0.0",
  "authority_layers": ["SYSTEM_POLICY", "OWNER_INTENT", "PROJECT_POLICY", "TASK_CAPSULE", "CHANGE_LEASE", "APPROVAL_RECEIPT", "EXPLICIT_OWNER_DECISION"],
  "owner_intent": {"schema": "governance/owner-intent.schema.json", "source": "owner"},
  "default_decision_preferences": {"prefer_reversible_changes": true, "prefer_local_over_cloud": true, "prefer_existing_dependencies": true, "prefer_fail_closed": true, "prefer_small_scoped_refactors": true, "prefer_draft_pr_over_direct_merge": true, "prefer_evidence_over_status_claims": true, "prefer_single_recommended_option": true, "prefer_continue_safe_work_when_partially_blocked": true},
  "risk_tiers": {
    "LOW_LOCAL": {"profile": "COMPACT", "agents": ["executor"], "approval_budget": {"target_owner_interruptions": 0, "maximum_owner_interruptions": 0}},
    "MEDIUM_REVIEW": {"profile": "STANDARD", "agents": ["executor", "reviewer"], "approval_budget": {"target_owner_interruptions": 0, "maximum_owner_interruptions": 1}},
    "HIGH_HUMAN_GATE": {"profile": "CRITICAL", "agents": ["orchestrator", "executor", "reviewer"], "approval_budget": {"target_owner_interruptions": 0, "maximum_owner_interruptions": 1}},
    "CRITICAL_BLOCK": {"profile": "BLOCKED", "agents": ["orchestrator", "reviewer"], "approval_budget": {"target_owner_interruptions": 0, "maximum_owner_interruptions": 1}}
  },
  "execution_profiles": {"COMPACT": {"required_agents": ["executor"], "review_required": false, "verification": "relevant_local_tests"}, "STANDARD": {"required_agents": ["executor"], "optional_agents": ["specialist"], "review_required_for_behavior_change": true, "verification": "verification_contract"}, "CRITICAL": {"required_agents": ["orchestrator", "executor", "reviewer"], "review_required": true, "lease_or_receipt_required": true, "verification": "full"}, "BLOCKED": {"no_effects": true, "safe_analysis_allowed": true, "decision_packet_allowed": true}},
  "decision_classes": {"A": "AUTONOMOUS", "B": "LEASE_OR_RECEIPT", "C": "BUNDLED_OWNER_DECISION", "D": "TECHNICAL_BLOCK"},
  "effect_classes": ["LOCAL_READ", "LOCAL_STATE", "LOCAL_WRITE", "LOCAL_DELETE", "LOCAL_EXECUTE", "TEST_EXECUTION", "LOCAL_COMMIT", "NETWORK", "EXTERNAL_COMMUNICATION", "PUSH", "DRAFT_PR_UPDATE", "MERGE", "PRODUCTION_DEPLOY", "SECRET_ACCESS", "IRREVERSIBLE_DELETE", "DELEGATE", "APPROVAL_ENGINE_MUTATION", "CAPABILITY_REGISTRY_MUTATION"],
  "reversibility_classes": ["FULLY_REVERSIBLE", "REVERSIBLE_WITH_BACKUP", "PARTIALLY_REVERSIBLE", "IRREVERSIBLE", "UNKNOWN_REVERSIBILITY"],
  "approval_budgets": {"default": {"target_owner_interruptions": 0, "maximum_owner_interruptions": 1, "allow_serial_approvals": false, "bundling_required": true}},
  "approval_receipts": {"schema": "governance/approval-receipt.schema.json", "signed": true, "expiry_required": true, "revocable": true, "reuse": "bounded"},
  "change_leases": {"schema": "governance/change-lease.schema.json", "effect_bound": true, "scope_bound": true, "self_extension": false},
  "approval_bundling": {"deduplicate_semantic_requests": true, "last_responsible_moment": true, "one_packet_per_owner_round": true},
  "approval_deduplication": {"key": ["effect", "resource_scope", "semantic_reason", "task_id"], "persist_across_restart": true},
  "scope_rules": {"read_scope": "analysis_allowed", "write_scope": "writes_only_inside", "forbidden_scope": "read_and_write_denied", "external_effect_scope": "separate_from_filesystem"},
  "agent_roles": {"orchestrator": {"edit": "deny", "coordinate": true, "approve": false}, "executor": {"edit": "capsule_only", "approve": false, "delegate": "explicitly_allowed"}, "reviewer": {"edit": "deny", "delegate": false, "approve": false}, "approval_coordinator": {"collect": true, "approve": false}},
  "delegation": {"scope_subset": true, "effects_subset": true, "risk_not_higher": true, "max_depth": 2, "owner_questions_centralized": true},
  "capability_registry": {"source": "governance/generated/capability-registry.json", "unknown_effect": "RED_BLOCK", "tool_output": "UNTRUSTED", "server_trust_is_not_authorization": true},
  "tool_capabilities": {
    "filesystem.read": {"tool": "filesystem", "action": "read", "effects": ["READ"], "effect_class": "LOCAL_READ", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "path-and-scope", "audit_level": "STANDARD"},
    "opencode.todo": {"tool": "opencode", "action": "todo", "effects": ["WRITE"], "effect_class": "LOCAL_STATE", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "internal-runtime-state", "audit_level": "STANDARD"},
    "filesystem.write": {"tool": "filesystem", "action": "write", "effects": ["WRITE"], "effect_class": "LOCAL_WRITE", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "path-and-scope", "audit_level": "STANDARD"},
    "filesystem.delete": {"tool": "filesystem", "action": "delete", "effects": ["WRITE"], "effect_class": "LOCAL_DELETE", "approval_class": "A_AUTONOMOUS", "reversibility": "REVERSIBLE_WITH_BACKUP", "lease_compatible": true, "validation": "backup-and-scope", "audit_level": "FULL"},
    "shell.execute": {"tool": "shell", "action": "execute", "effects": ["EXECUTE"], "effect_class": "LOCAL_EXECUTE", "approval_class": "A_AUTONOMOUS", "reversibility": "UNKNOWN_REVERSIBILITY", "lease_compatible": true, "validation": "command-and-scope", "audit_level": "FULL"},
    "test.run": {"tool": "test", "action": "run", "effects": ["EXECUTE"], "effect_class": "TEST_EXECUTION", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "runner-output", "audit_level": "STANDARD"},
    "git.commit": {"tool": "git", "action": "commit", "effects": ["WRITE"], "effect_class": "LOCAL_COMMIT", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "branch-and-diff", "audit_level": "FULL"},
    "git.push": {"tool": "git", "action": "push", "effects": ["EXTERNAL"], "effect_class": "PUSH", "approval_class": "C_BUNDLED_OWNER_DECISION", "reversibility": "PARTIALLY_REVERSIBLE", "lease_compatible": true, "validation": "remote-and-branch", "audit_level": "FULL"},
    "git.merge": {"tool": "git", "action": "merge", "effects": ["EXTERNAL"], "effect_class": "MERGE", "approval_class": "C_BUNDLED_OWNER_DECISION", "reversibility": "IRREVERSIBLE", "lease_compatible": true, "validation": "protected-branch", "audit_level": "FULL"},
    "agent.delegate": {"tool": "agent", "action": "delegate", "effects": ["DELEGATE"], "effect_class": "DELEGATE", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "capsule-subset", "audit_level": "FULL"},
    "network.read": {"tool": "network", "action": "read", "effects": ["NETWORK"], "effect_class": "NETWORK", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "host-and-scope", "audit_level": "FULL"},
    "mcp.read": {"tool": "mcp", "action": "read", "effects": ["READ"], "effect_class": "LOCAL_READ", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "mcp-schema-and-scope", "audit_level": "FULL"},
    "mcp.write": {"tool": "mcp", "action": "write", "effects": ["WRITE"], "effect_class": "LOCAL_WRITE", "approval_class": "A_AUTONOMOUS", "reversibility": "FULLY_REVERSIBLE", "lease_compatible": true, "validation": "mcp-schema-and-scope", "audit_level": "FULL"},
    "deployment.production": {"tool": "deployment", "action": "production", "effects": ["EXTERNAL"], "effect_class": "PRODUCTION_DEPLOY", "approval_class": "C_BUNDLED_OWNER_DECISION", "reversibility": "IRREVERSIBLE", "lease_compatible": true, "validation": "environment-and-rollback", "audit_level": "FULL"},
    "communication.send": {"tool": "communication", "action": "send", "effects": ["EXTERNAL"], "effect_class": "EXTERNAL_COMMUNICATION", "approval_class": "C_BUNDLED_OWNER_DECISION", "reversibility": "IRREVERSIBLE", "lease_compatible": false, "validation": "recipient-and-content", "audit_level": "FULL"}
  },
  "evidence_contracts": {"claims_require_proportionate_evidence": true, "approval_compliance": ["receipt_or_lease_id", "scope", "effect", "reversibility", "actor", "timestamp"], "outcome_verification": true},
  "completion_classifications": ["RED_BLOCK", "TOOL_GAP", "NEEDS_REVIEW", "VERIFIED_IN_SCOPE"],
  "prompt_kernel": {"file": "PROMPT-KERNEL.md", "max_tokens": 2500, "permanent_rules": 8, "lazy_detail_policies": true}
}
