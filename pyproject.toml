[build-system]
requires = ["setuptools>=69"]
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "ocae-cli"
dynamic = ["version"]
description = "Installable distribution CLI for the OpenCode-Agenten-Oekosystem"
readme = "docs/ocae-cli.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "OpenCode-Agenten-Oekosystem contributors" }]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
ocae = "ocae_cli.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ocae_cli = ["_payload/*.tar.gz", "_payload/*.json", "_version.py"]
"ocae_cli._adapter" = ["*.js"]

[tool.setuptools.dynamic]
version = { attr = "ocae_cli.__version__" }

[tool.pytest.ini_options]
testpaths = ["test/python"]
